name: Test verbose false option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: build
        uses: .
        with:
          source: tests/fixtures/simple-site/
          destination: tests/fixtures/simple-site/_site_quiet
          verbose: false
          token: ${{ github.token }}

      - name: Assert build succeeded with verbose=false
        run: |
          SITE_DIR="$GITHUB_WORKSPACE/tests/fixtures/simple-site/_site_quiet"
          echo "Checking for site directory: $SITE_DIR"
          if [ ! -d "$SITE_DIR" ]; then
            echo "FAIL: _site directory was not created when verbose=false"
            exit 1
          fi
          INDEX="$SITE_DIR/index.html"
          if [ ! -f "$INDEX" ]; then
            echo "FAIL: index.html was not generated when verbose=false"
            exit 1
          fi
          echo "PASS: build succeeded with verbose=false, index.html exists"
