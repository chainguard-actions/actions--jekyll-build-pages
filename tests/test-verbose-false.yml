name: Test build with verbose output disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Jekyll site in workspace root
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/simple-site/." "$GITHUB_WORKSPACE/"

      - id: build
        uses: .
        continue-on-error: true
        with:
          source: ./
          destination: ./_site
          verbose: false
          token: ${{ github.token }}

      - name: Assert build outcome
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "Build outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Build succeeded, checking output..."
            if [ ! -d "$GITHUB_WORKSPACE/_site" ]; then
              echo "FAIL: _site directory was not created"
              exit 1
            fi
            if [ ! -f "$GITHUB_WORKSPACE/_site/index.html" ]; then
              echo "FAIL: index.html was not generated in _site"
              ls -la "$GITHUB_WORKSPACE/_site/" || true
              exit 1
            fi
            echo "PASS: Jekyll build succeeded with verbose=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable by github-pages gem)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
