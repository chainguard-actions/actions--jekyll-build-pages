name: Test basic Jekyll build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Set up Jekyll source files in workspace root
        run: |
          cp tests/fixtures/jekyll-site/index.md "$GITHUB_WORKSPACE/index.md"
          cp tests/fixtures/jekyll-site/_config.yml "$GITHUB_WORKSPACE/_config.yml"

      - id: build
        uses: .
        continue-on-error: true
        with:
          source: ./
          destination: ./_site
          token: ${{ github.token }}
          verbose: true

      - name: Assert site was built or failed gracefully
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Build succeeded, checking output..."
            if [ ! -d "$GITHUB_WORKSPACE/_site" ]; then
              echo "FAIL: _site directory was not created"
              exit 1
            fi
            echo "PASS: _site directory exists"
            if [ ! -f "$GITHUB_WORKSPACE/_site/index.html" ]; then
              echo "FAIL: index.html was not generated in _site"
              ls -la "$GITHUB_WORKSPACE/_site/" || true
              exit 1
            fi
            echo "PASS: index.html exists"
            head -20 "$GITHUB_WORKSPACE/_site/index.html"
            if ! grep -q "Hello World" "$GITHUB_WORKSPACE/_site/index.html"; then
              echo "FAIL: index.html does not contain expected content 'Hello World'"
              cat "$GITHUB_WORKSPACE/_site/index.html"
              exit 1
            fi
            echo "PASS: index.html contains expected content"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or Docker environment limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
