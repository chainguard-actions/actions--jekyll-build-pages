name: "Test"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.regex-match.outputs.group1 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Grep action.yaml content
        id: grep-image-content
        run: |
          image=$(grep -E "jekyll-build-pages.*'" action.yml)
          safe_image=$(printf '%s' "$image" | tr -d '\n\r')
          echo "image=$safe_image" >> "$GITHUB_OUTPUT"
      - uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2
        id: regex-match
        with:
          text: ${{ steps.grep-image-content.outputs.image }}
          regex: "jekyll-build-pages:(.*)'"

  test-builds:
    needs: resolve-image-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test:
          - simple
          - readme
          - octicons
          - mojombo
          - themes
          - jekyll-include-cache
          - future-false
          - future-true
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Build local docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          file: Dockerfile
          tags: ${{ needs.resolve-image-tag.outputs.tag }}
      - name: Test ${{ matrix.test }} Project
        uses: ./
        with:
          source: ./test_projects/${{ matrix.test }}
          destination: ./test_projects/${{ matrix.test }}/_site
          build_revision: JEKYLL_BUILD_REVISION
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify output
        env:
          MATRIX_TEST: ${{ matrix.test }}
        run: |
          ./bin/compare_expected_output "./test_projects/$MATRIX_TEST"
