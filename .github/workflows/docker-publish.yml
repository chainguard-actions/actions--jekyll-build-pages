name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches:
      - 'main'
      - 'feature-*'
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Image Tags
        id: generate-image-tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REGISTRY_VAL: ${{ env.REGISTRY }}
          IMAGE_NAME_VAL: ${{ env.IMAGE_NAME }}
        run: |
          # Generate tags for the image
          safe_ref=$(printf '%s' "$REF_NAME" | tr -d '\n\r')
          safe_registry=$(printf '%s' "$REGISTRY_VAL" | tr -d '\n\r')
          safe_image=$(printf '%s' "$IMAGE_NAME_VAL" | tr -d '\n\r')
          if [[ "$safe_ref" == "main" ]]; then
            tags="${safe_registry}/${safe_image}:latest"
          else
            tags="${safe_registry}/${safe_image}:${safe_ref}"
          fi
          safe_tags=$(printf '%s' "$tags" | tr -d '\n\r')
          echo "tags=$safe_tags" >> "$GITHUB_OUTPUT"
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.generate-image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
